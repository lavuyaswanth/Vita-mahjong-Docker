server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (the JS bundle is ~286KB raw → ~87KB gzipped)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell and service worker are the deploy entry points — never
    # cache them, or users can stay pinned to an old build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Vite output under /assets/ is content-hashed: safe to cache forever.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Icons and other stable-name statics: cache briefly (names don't change
    # when the content does, so no "immutable" here).
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|ico|cur|svg|woff|woff2|mp4|webm)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
